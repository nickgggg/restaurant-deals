name: Triage deal report

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  actions: write

jobs:
  triage:
    if: startsWith(github.event.issue.title, '[Deal report]')
    runs-on: ubuntu-latest
    steps:
      - name: Validate and queue report
        uses: actions/github-script@v8
        with:
          script: |
            const body = context.payload.issue.body || '';
            const issue = context.payload.issue;
            const field = (label) => {
              const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const match = body.match(new RegExp(`### ${escaped}\\s+([\\s\\S]*?)(?=\\n### |$)`, 'i'));
              return match?.[1]?.trim() || '';
            };

            const restaurant = field('Restaurant');
            const city = field('City');
            const source = field('Official source URL');
            const details = field('Details');
            let validUrl = false;
            try {
              const parsed = new URL(source);
              validUrl = ['http:', 'https:'].includes(parsed.protocol);
            } catch (_) {}

            const usefulDetails = details.replace(/<!--.*?-->/gs, '').trim();
            const ready = Boolean(restaurant && city && usefulDetails.length >= 10 && validUrl);
            const trustedUsers = new Set(['nickgggg', 'nickg-erg']);
            const trusted = ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(issue.author_association)
              || trustedUsers.has(issue.user.login.toLowerCase());
            const existingLabels = new Set(issue.labels.map((label) => label.name));
            const labels = [
              { name: 'deal-report', color: '007c89', description: 'Missing or incorrect restaurant deal report' },
              ready
                ? { name: 'report-ready', color: '0e8a16', description: 'Report passed automated completeness checks' }
                : { name: 'needs-info', color: 'd4c5f9', description: 'Report needs a valid source or more detail' },
            ];
            if (ready) {
              labels.push({ name: 'source-candidate', color: 'fbca04', description: 'Official source URL queued for crawler review' });
            }

            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, ...label });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: labels.map((label) => label.name),
            });
            const staleLabel = ready ? 'needs-info' : 'report-ready';
            if (existingLabels.has(staleLabel)) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                name: staleLabel,
              });
            }

            let message = ready
              ? 'Automated check passed: the report includes a restaurant, city, valid official source, and supporting details.'
              : 'The automated check needs a valid official source URL and complete restaurant, city, and details fields before this can be reviewed.';
            if (ready && trusted && !existingLabels.has('report-ready')) {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'update-deals.yml',
                ref: 'main',
              });
              message += ' Its official source is now first in the crawler queue, and a fresh crawl has been started.';
            } else if (ready && trusted) {
              message += ' Its official source remains in the priority crawler queue.';
            } else if (ready) {
              message += ' Its official source is queued for review; public reports cannot directly spend API quota or change production data.';
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: message,
            });

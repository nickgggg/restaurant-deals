name: Update deals

on:
  push:
    branches:
      - main
    paths:
      - crawler/**
      - .github/workflows/update-deals.yml
  schedule:
    - cron: "37 14 * * *"
    - cron: "17 16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-deals
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check whether fallback refresh is needed
        id: freshness
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta, timezone

          should_run = True
          if os.environ.get("EVENT_SCHEDULE") == "17 16 * * *":
              try:
                  payload = json.load(open("docs/data/deals.json"))
                  generated = datetime.fromisoformat(payload["generated_at"].replace("Z", "+00:00"))
                  should_run = datetime.now(timezone.utc) - generated >= timedelta(hours=8)
              except (FileNotFoundError, KeyError, TypeError, ValueError, json.JSONDecodeError):
                  pass
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"should_run={str(should_run).lower()}\n")
          PY

      - name: Set up Python
        if: steps.freshness.outputs.should_run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refresh nearby restaurant coverage
        if: steps.freshness.outputs.should_run == 'true'
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: python crawler/discover_restaurants.py

      - name: Extract verified deals from candidate pages
        if: steps.freshness.outputs.should_run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python crawler/extract_with_gemini.py

      - name: Crawl deals
        if: steps.freshness.outputs.should_run == 'true'
        run: python crawler/crawl_deals.py

      - name: Publish report crawl results
        if: steps.freshness.outputs.should_run == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const payload = JSON.parse(fs.readFileSync('docs/data/ai_extractions.json', 'utf8'));
            const reports = new Map();
            for (const page of payload.pages || []) {
              const issueNumber = page.page?.report_issue;
              if (issueNumber) reports.set(issueNumber, page);
            }

            for (const [issueNumber, page] of reports) {
              const verified = page.status === 'ok' && (page.deals || []).length > 0;
              const label = verified
                ? { name: 'source-verified', color: '0e8a16', description: 'Crawler verified deal evidence at the reported source' }
                : { name: 'source-needs-review', color: 'b60205', description: 'Crawler could not automatically verify the reported source' };
              try {
                await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, ...label });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
              const issue = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });
              const existing = new Set(issue.data.labels.map((item) => typeof item === 'string' ? item : item.name));
              if (existing.has(label.name)) continue;
              const opposite = verified ? 'source-needs-review' : 'source-verified';
              if (existing.has(opposite)) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: opposite,
                });
              }
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: [label.name],
              });
              const message = verified
                ? `Automated source check verified ${(page.deals || []).length} evidence-backed ${(page.deals || []).length === 1 ? 'deal' : 'deals'} at ${page.page.url}. The report remains open until the correction is reviewed against the published result.`
                : `Automated source check could not verify a publishable deal at ${page.page.url} (${page.status}). This report remains open for review; no public deal data was changed from the report alone.`;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: message,
              });
            }

      - name: Commit updated data
        if: steps.freshness.outputs.should_run == 'true'
        run: |
          files=(docs/data/deals.json docs/data/restaurants.json docs/data/ai_extractions.json)
          if git diff --quiet -- "${files[@]}"; then
            echo "No data changes to publish"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "Update deals data"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "The branch changed while crawling; rebasing before retry $attempt"
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done
          echo "Could not publish refreshed data after three attempts"
          exit 1
